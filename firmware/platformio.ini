; STARYS — сборка прошивки модуля роя.
;   pio run                 — собрать оба модуля
;   pio run -e module1      — только модуль №1
; Готовые .bin/.elf подхватываются файлами wokwi/module*/wokwi.toml
; (расширение Wokwi для VS Code).

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    madhephaestus/ESP32Servo@^3.0.5
    adafruit/Adafruit SSD1306@^2.5.12
    adafruit/Adafruit GFX Library@^1.11.11
build_flags = -std=gnu++17

[env:module1]
build_flags = ${env.build_flags} -DMODULE_ID=1

[env:module2]
build_flags = ${env.build_flags} -DMODULE_ID=2
