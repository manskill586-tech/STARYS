name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: Тесты логики модуля
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать и прогнать тесты
        run: make -C firmware/test trace

  firmware:
    name: Сборка прошивки ESP32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить PlatformIO
        run: pip install platformio
      - name: Собрать модули 1 и 2
        run: pio run -d firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/.pio/build/module*/firmware.bin
